name: 3D Contribution Graph

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

concurrency:
  group: profile-svg-updates
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: main
      - name: Generate contribution graphs
        uses: yoshi389111/github-profile-3d-contrib@7d95e7d4cdc028dd1e1cbd957d65f35efb12ae39 # v0.9.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
      - name: Verify README graph files
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          for name in ("profile-season-animate.svg", "profile-night-rainbow.svg", "profile-season.svg"):
              path = Path("profile-3d-contrib") / name
              assert path.stat().st_size > 0, f"Empty SVG: {path}"
              assert ET.parse(path).getroot().tag == "{http://www.w3.org/2000/svg}svg", f"Invalid SVG: {path}"
          PY
      - name: Commit generated graphs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- profile-3d-contrib/*.svg
          changes=$(git diff --cached --name-only)
          if [ -z "$changes" ]; then
            echo "Contribution graphs are unchanged."
            exit 0
          fi
          git commit -m "chore: update 3D contribution graphs"
          git push origin HEAD:main
