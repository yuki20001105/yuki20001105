name: GitHub Metrics

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

concurrency:
  group: profile-svg-updates
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: main
      - name: Generate metrics from public information
        uses: lowlighter/metrics@65836723097537a54cd8eb90f61839426b4266b6 # v3.34
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          user: ${{ github.repository_owner }}
          filename: output/metrics.svg
          output_action: none
          base: header, activity, community, repositories, metadata
          config_timezone: Asia/Tokyo
          repositories_affiliations: owner
          plugin_languages: yes
          plugin_languages_details: bytes-size, percentage
          plugin_languages_limit: 8
          plugin_followup: yes
          plugin_achievements: yes
          plugin_achievements_display: compact
          plugin_achievements_threshold: X
          plugins_errors_fatal: yes
          retries: 1
          retries_delay: 0
      - name: Verify and copy metrics
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import shutil
          import xml.etree.ElementTree as ET

          source = Path("/metrics_renders/output/metrics.svg")
          assert source.stat().st_size > 0, "Metrics SVG is empty"
          assert ET.parse(source).getroot().tag == "{http://www.w3.org/2000/svg}svg", "Invalid Metrics SVG"
          Path("output").mkdir(exist_ok=True)
          shutil.copyfile(source, "output/metrics.svg")
          PY
      - name: Commit generated metrics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- output/metrics.svg
          if git diff --cached --quiet; then
            echo "Metrics are unchanged."
            exit 0
          fi
          git commit -m "chore: update GitHub Metrics"
          git push origin HEAD:main
